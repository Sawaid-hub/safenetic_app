name: safenetic_app
description: "SafeNetic - A secure and intuitive mobile application"
publish_to: 'none'

version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter

  # --- Machine Learning ---
  tflite_flutter: ^0.11.0
  
  # --- Audio Pipeline ---
  flutter_sound: ^9.16.3
  fftea: ^1.1.1
  
  # --- Sensors ---
  sensors_plus: ^4.0.2

  # --- Firebase ---
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_messaging: ^16.1.0

  # --- UI and Navigation ---
  cupertino_icons: ^1.0.8
  go_router: ^14.6.1

  # --- State Management ---
  provider: ^6.1.2

  # --- Local Storage ---
  shared_preferences: ^2.3.2
  sqflite: ^2.3.0
  path: ^1.8.3

  # --- Network ---
  http: ^1.2.2
  dio: ^5.7.0

  # --- SMS (native SmsManager) ---
  # Vendored locally: upstream 0.0.4 uses the removed Flutter v1 embedding
  # API (PluginRegistry.Registrar) in dead code, which fails to compile
  # against current AGP/Flutter. See third_party/background_sms/.
  background_sms:
    path: third_party/background_sms

  # --- Utilities ---
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  url_launcher: ^6.2.5

  # --- UI Components ---
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # --- Device Features ---
  connectivity_plus: ^6.1.0
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.0

  # --- Location and Maps ---
  google_maps_flutter: ^2.9.0
  location: ^7.0.0
  geolocator: ^13.0.1

  # --- Bluetooth ---
  flutter_blue_plus: ^1.32.7
  permission_handler: ^11.3.1

  # --- Image and Media ---
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  audioplayers: ^6.6.0
  battery_plus: ^7.0.0
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^20.1.0
  flutter_contacts: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/models/
    - assets/audio/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
